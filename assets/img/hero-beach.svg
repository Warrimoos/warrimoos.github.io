<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stylised beach scene with sun, ocean waves and paw prints in the sand">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9FD9F0"/>
      <stop offset="0.55" stop-color="#C8EAF2"/>
      <stop offset="1" stop-color="#FCEBC4"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E7FA8"/>
      <stop offset="1" stop-color="#1FA3B5"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0DDB2"/>
      <stop offset="1" stop-color="#F6E7C2"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE9A8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.22  0 0 0 0.06 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1600" height="540" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="1190" cy="190" r="190" fill="url(#sunGlow)"/>
  <circle cx="1190" cy="190" r="86" fill="#FFD66B"/>
  <circle cx="1190" cy="190" r="86" fill="none" stroke="#FFC247" stroke-width="6" opacity="0.6"/>

  <!-- clouds -->
  <g fill="#FFFFFF" opacity="0.85">
    <ellipse cx="300" cy="150" rx="110" ry="30"/>
    <ellipse cx="370" cy="128" rx="70" ry="24"/>
    <ellipse cx="240" cy="132" rx="60" ry="20"/>
  </g>
  <g fill="#FFFFFF" opacity="0.7">
    <ellipse cx="840" cy="90" rx="90" ry="24"/>
    <ellipse cx="900" cy="72" rx="55" ry="18"/>
  </g>
  <g fill="#FFFFFF" opacity="0.55">
    <ellipse cx="1450" cy="330" rx="80" ry="20"/>
    <ellipse cx="1500" cy="314" rx="46" ry="14"/>
  </g>

  <!-- gulls -->
  <g fill="none" stroke="#3E647C" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <path d="M520 220 q22 -20 44 0 q22 -20 44 0"/>
    <path d="M640 170 q16 -15 33 0 q16 -15 33 0" stroke-width="4"/>
    <path d="M980 260 q13 -12 27 0 q13 -12 27 0" stroke-width="3.5"/>
  </g>

  <!-- distant headland -->
  <path d="M0 540 L0 452 Q120 408 250 442 Q360 470 470 540 Z" fill="#57A06A" opacity="0.9"/>
  <path d="M0 540 L0 492 Q90 462 200 488 Q300 510 380 540 Z" fill="#3F8554" opacity="0.9"/>

  <!-- ocean -->
  <rect x="0" y="520" width="1600" height="230" fill="url(#sea)"/>
  <path d="M0 520 H1600 V552 Q1500 538 1380 552 T1140 552 T900 552 T660 552 T420 552 T180 552 Q80 562 0 550 Z" fill="#3FB8C9" opacity="0.8"/>
  <path d="M0 600 Q100 586 200 600 T400 600 T600 600 T800 600 T1000 600 T1200 600 T1400 600 T1600 600 V650 Q1500 664 1400 650 T1200 650 T1000 650 T800 650 T600 650 T400 650 T200 650 Q100 638 0 652 Z" fill="#7FD4DE" opacity="0.85"/>
  <!-- foam edge -->
  <path d="M0 690 Q80 676 160 690 T320 690 T480 690 T640 690 T800 690 T960 690 T1120 690 T1280 690 T1440 690 T1600 690 V760 H0 Z" fill="#EAF9F7"/>

  <!-- wet sand with reflections -->
  <rect x="0" y="745" width="1600" height="90" fill="#E5CFA4"/>
  <g stroke="#FFF7E2" stroke-width="6" stroke-linecap="round" opacity="0.55">
    <path d="M120 790 H360"/>
    <path d="M620 805 H900"/>
    <path d="M1150 786 H1430"/>
  </g>

  <!-- dry sand -->
  <rect x="0" y="820" width="1600" height="180" fill="url(#sand)" filter="url(#grain)"/>

  <!-- shells and pebbles -->
  <g opacity="0.8">
    <circle cx="1245" cy="900" r="9" fill="#E3C28F"/>
    <circle cx="1278" cy="922" r="6" fill="#D9B47E"/>
    <path d="M395 935 a14 14 0 0 1 28 0 q-14 12 -28 0 Z" fill="#F2A98F"/>
    <circle cx="980" cy="958" r="7" fill="#DDB986"/>
  </g>

  <!-- starfish -->
  <g transform="translate(1395 905) scale(0.95)" fill="#FF8A6B">
    <path d="M0 -26 L7 -8 L26 -7 L11 5 L16 24 L0 13 L-16 24 L-11 5 L-26 -7 L-7 -8 Z"/>
    <circle cx="0" cy="0" r="4" fill="#FFB59B"/>
  </g>

  <!-- paw prints wandering up the beach -->
  <g fill="#D8BE8E">
    <g transform="translate(220 952) rotate(-12)">
      <ellipse cx="0" cy="6" rx="13" ry="10"/><ellipse cx="-12" cy="-8" rx="5" ry="7"/><ellipse cx="0" cy="-12" rx="5" ry="7"/><ellipse cx="12" cy="-8" rx="5" ry="7"/>
    </g>
    <g transform="translate(310 918) rotate(8)">
      <ellipse cx="0" cy="6" rx="13" ry="10"/><ellipse cx="-12" cy="-8" rx="5" ry="7"/><ellipse cx="0" cy="-12" rx="5" ry="7"/><ellipse cx="12" cy="-8" rx="5" ry="7"/>
    </g>
    <g transform="translate(405 895) rotate(-6)">
      <ellipse cx="0" cy="6" rx="12" ry="9"/><ellipse cx="-11" cy="-7" rx="4.5" ry="6.5"/><ellipse cx="0" cy="-11" rx="4.5" ry="6.5"/><ellipse cx="11" cy="-7" rx="4.5" ry="6.5"/>
    </g>
    <g transform="translate(498 875) rotate(10)">
      <ellipse cx="0" cy="6" rx="11" ry="8.5"/><ellipse cx="-10" cy="-7" rx="4" ry="6"/><ellipse cx="0" cy="-10" rx="4" ry="6"/><ellipse cx="10" cy="-7" rx="4" ry="6"/>
    </g>
    <g transform="translate(588 860) rotate(-4)" opacity="0.85">
      <ellipse cx="0" cy="5" rx="10" ry="8"/><ellipse cx="-9" cy="-6" rx="3.6" ry="5.4"/><ellipse cx="0" cy="-9" rx="3.6" ry="5.4"/><ellipse cx="9" cy="-6" rx="3.6" ry="5.4"/>
    </g>
  </g>

  <!-- beach ball -->
  <g transform="translate(1100 940)">
    <ellipse cx="2" cy="34" rx="30" ry="7" fill="#C9AD7C" opacity="0.55"/>
    <circle cx="0" cy="0" r="34" fill="#FFFDF7"/>
    <path d="M0 -34 A34 34 0 0 1 0 34 A50 50 0 0 0 0 -34 Z" fill="#FF6F5E"/>
    <path d="M0 -34 A34 34 0 0 0 0 34 A50 50 0 0 1 0 -34 Z" fill="#13A89E"/>
    <path d="M-24 -24 A34 34 0 0 1 24 -24 A44 44 0 0 0 -24 -24 Z" fill="#FFC247"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#16384C" stroke-opacity="0.12" stroke-width="2"/>
  </g>
</svg>
